name: Build and Push

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout and build
        required: true
        type: string
      image-tags:
        description: Comma-separated Docker image tags (without registry prefix)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve image tags
        id: tags
        run: |
          TAGS=""
          IFS=',' read -ra PARTS <<< "${{ inputs.image-tags }}"
          for tag in "${PARTS[@]}"; do
            tag="$(echo "$tag" | xargs)"
            if [ -n "$tag" ]; then
              if [ -n "$TAGS" ]; then
                TAGS="${TAGS},"
              fi
              TAGS="${TAGS}ghcr.io/mdg-labs/berth:${tag}"
            fi
          done
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
