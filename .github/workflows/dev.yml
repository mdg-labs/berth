name: Dev

on:
  push:
    branches: [dev]

concurrency:
  group: dev-${{ github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    uses: ./.github/workflows/build-push.yml
    with:
      ref: dev
      image-tags: dev
    permissions:
      contents: read
      packages: write

  deploy:
    needs: build-push
    uses: ./.github/workflows/deploy-coolify.yml
    secrets:
      COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
      COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
