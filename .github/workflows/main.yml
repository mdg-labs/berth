name: Main

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  maybe-draft-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: version
        run: |
          CURRENT="$(jq -r .version package.json)"
          PREVIOUS="$(git show HEAD^:package.json 2>/dev/null | jq -r .version || echo "")"

          if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No version found in package.json"
            exit 0
          fi

          if [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version unchanged (${CURRENT})"
            exit 0
          fi

          TAG="v${CURRENT}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version bumped: ${PREVIOUS:-<none>} -> ${CURRENT}"

      - name: Generate release notes
        if: steps.version.outputs.skip != 'true'
        run: |
          chmod +x .github/scripts/release-notes.sh
          .github/scripts/release-notes.sh > release-notes.md

      - name: Draft release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md
