# Production override for Berth — copy to compose.prod.yml and customize.
#
# Two deployment modes:
#
# 1. Build from source (default). Run from the repository checkout:
#      docker compose -f docker/compose.yml -f /opt/berth/compose.prod.yml up -d --build
#
# 2. Pre-built release image. Uncomment the "Release image" block under the
#    app service, set the release version, then run without --build:
#      docker compose -f docker/compose.yml -f /opt/berth/compose.prod.yml pull
#      docker compose -f docker/compose.yml -f /opt/berth/compose.prod.yml up -d
#
# Requires Docker Compose v2.24.4 or later: the !reset and !override tags below
# are not supported by older releases.
#
# Replace every registry.example.com and path below before deploying.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Do not publish Postgres to the internet (requires Compose v2.24.4+ for !reset).
    ports: !reset []

  registry:
    volumes:
      - registry-data:/var/lib/registry
      - ./registry/config.prod.local.yml:/etc/distribution/config.yml:ro
      - ${BERTH_SECRETS_DIR:?set BERTH_SECRETS_DIR}/rootcert.pem:/etc/registry/certs/rootcert.pem:ro
    environment:
      REGISTRY_AUTH_TOKEN_REALM: https://registry.example.com/api/auth/token
    ports: !reset []

  app:
    # Release image (optional, instead of building from source): replace X.Y.Z
    # with the release version (the image tag has no leading "v": release v0.1.0
    # is ghcr.io/mdg-labs/berth:0.1.0; never a floating tag such as latest) and
    # uncomment both lines. `build: !reset null` removes the build inherited
    # from compose.yml.
    # image: ghcr.io/mdg-labs/berth:X.Y.Z
    # build: !reset null
    #
    # Replace the dev 0.0.0.0:8080 publish with a loopback-only one. !override
    # (Compose v2.24.4+) replaces the base list; !reset would drop it entirely.
    ports: !override
      - "127.0.0.1:8080:3000"
    volumes:
      - registry-data:/var/lib/registry:ro
      - ${BERTH_SECRETS_DIR}/token-signing-key.pem:/etc/berth/token/signing-key.pem:ro
      - ${BERTH_SECRETS_DIR}/token-signing-cert.pem:/etc/berth/token/signing-cert.pem:ro
    environment:
      DATABASE_URL: postgresql://berth:${POSTGRES_PASSWORD}@postgres:5432/berth
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      APP_URL: https://registry.example.com
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      # Drop the dev password inherited from compose.yml; without it the first
      # start generates a one-time admin password and logs it once.
      BOOTSTRAP_ADMIN_PASSWORD: !reset null
      TOKEN_SIGNING_KEY_PATH: /etc/berth/token/signing-key.pem
      TOKEN_CERT_PATH: /etc/berth/token/signing-cert.pem
      RATE_LIMIT_LOGIN_MAX_ATTEMPTS: "10"
      RATE_LIMIT_TOKEN_MAX_ATTEMPTS: "10"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      # Optional OIDC:
      # OIDC_ISSUER: https://idp.example.com
      # OIDC_CLIENT_ID: berth
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # Optional SMTP (password reset / invites):
      # SMTP_HOST: smtp.example.com
      # SMTP_PORT: "587"
      # SMTP_USER: berth
      # SMTP_PASSWORD: ${SMTP_PASSWORD}
      # EMAIL_FROM: noreply@example.com
