name: berth

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: berth
      POSTGRES_PASSWORD: berth
      POSTGRES_DB: berth
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - berth-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berth -d berth"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  registry:
    image: registry:3
    volumes:
      - registry-data:/var/lib/registry
      - ./registry/config.yml:/etc/distribution/config.yml:ro
      - ./registry/certs/rootcert.pem:/etc/registry/certs/rootcert.pem:ro
    environment:
      REGISTRY_AUTH: token
      REGISTRY_AUTH_TOKEN_REALM: http://localhost:8080/api/auth/token
      REGISTRY_AUTH_TOKEN_SERVICE: registry
      REGISTRY_AUTH_TOKEN_ISSUER: registry
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /etc/registry/certs/rootcert.pem
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    networks:
      - berth-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S --spider http://localhost:5000/v2/ 2>&1 | grep -q '401 Unauthorized'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: postgresql://berth:berth@postgres:5432/berth
      REGISTRY_INTERNAL_URL: http://registry:5000
      TOKEN_ISSUER: registry
      SESSION_SECRET: dev-session-secret-change-in-production
      APP_URL: http://localhost:8080
      BOOTSTRAP_ADMIN_EMAIL: admin@localhost
      BOOTSTRAP_ADMIN_PASSWORD: test-admin-password
      RATE_LIMIT_LOGIN_MAX_ATTEMPTS: "10"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_healthy
    networks:
      - berth-internal
    restart: unless-stopped

networks:
  berth-internal:
    driver: bridge

volumes:
  registry-data:
  postgres-data:
