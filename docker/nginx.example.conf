# Host-level nginx TLS termination for Berth.
# Install on the same host as the compose stack; Berth app listens on 127.0.0.1:8080 only.
#
# 1. Copy to /etc/nginx/sites-available/berth (or conf.d/berth.conf)
# 2. Replace registry.example.com and certificate paths
# 3. Obtain certs (e.g. certbot certonly --nginx -d registry.example.com)
# 4. nginx -t && systemctl reload nginx

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name registry.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name registry.example.com;

    # Let's Encrypt (certbot) paths — adjust for your CA layout
    ssl_certificate     /etc/letsencrypt/live/registry.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registry.example.com/privkey.pem;

    # Large layer uploads — no body size limit
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
}
