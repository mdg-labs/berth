# Host-level nginx TLS termination for Berth.
# Install on the same host as the compose stack; Berth app listens on 127.0.0.1:8080 only.
#
# Order matters: the TLS server block below references certificate files that
# do not exist until the certificate is issued, so nginx -t fails (and so does
# certbot's nginx plugin) if this whole file is enabled first.
#
# 1. Create /var/www/certbot and enable an HTTP-only server block for
#    registry.example.com that serves /.well-known/acme-challenge/ from it
#    (the port 80 block below, without the TLS block), then reload nginx
# 2. Obtain the certificate:
#    certbot certonly --webroot -w /var/www/certbot -d registry.example.com
# 3. Copy this whole file to /etc/nginx/sites-available/berth (or
#    conf.d/berth.conf) and replace registry.example.com and certificate paths
# 4. nginx -t && systemctl reload nginx

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name registry.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name registry.example.com;

    # Let's Encrypt (certbot) paths — adjust for your CA layout
    ssl_certificate     /etc/letsencrypt/live/registry.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registry.example.com/privkey.pem;

    # Large layer uploads — no body size limit
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This proxy is the edge: overwrite, never append to, a client-supplied value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
}
